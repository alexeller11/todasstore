services:
  - type: web
    name: todasstore
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Antes de subir a nova versão do gunicorn, aplica as migrations Alembic
    # de forma idempotente. Usa um script Python SEPARADO (subprocess self)
    # para garantir que as conexões abertas pelo processo de migration sejam
    # descartadas antes do runtime subir. Rodar stamp/upgrade no MESMO
    # contexto do create_app() deixava transações PostgreSQL "aborted" e o
    # runtime herdava conexões quebradas (InFailedSqlTransaction).
    preDeployCommand: "python scripts/run_migrations.py"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_PRINCIPAL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_ALTERNATIVO
        value: qwen/qwen3-32b
      - key: DATABASE_URL
        fromDatabase:
          name: todasstore-db
          property: connectionString

databases:
  - name: todasstore-db
    plan: free
    databaseName: todasstore
    user: todasstore

services:
  - type: web
    name: todasstore
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_PRINCIPAL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_ALTERNATIVO
        value: qwen/qwen3-32b
      - key: DATABASE_URL
        fromDatabase:
          name: todasstore-db
          property: connectionString

databases:
  - name: todasstore-db
    plan: free
    databaseName: todasstore
    user: todasstore
